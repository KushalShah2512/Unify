name: gigsy
description: "Gigsy - AI Powered Gig & Internship Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^16.0.0

  # Network
  dio: ^5.9.0

  # Local Storage
  shared_preferences: ^2.5.3

  # Responsive UI
  flutter_screenutil: ^5.9.3

  # Fonts
  google_fonts: ^6.3.1

  # SVG Support
  flutter_svg: ^2.2.0

  # Loading Animations
  flutter_spinkit: ^5.2.2

  # Toast Messages
  fluttertoast: ^8.2.12

  # Date Formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700